# Projektová konfigurace Codexu pro genealogii. Načítá se pouze v důvěryhodném projektu.
# Při nedostupnosti modelu vyber odpovídající dostupný model v Codexu.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"
